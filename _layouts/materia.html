---
layout: default
---
<article class="wrap article"><a href="{{ '/' | relative_url }}#materias">← Todas as reportagens</a><p class="kicker">{{ page.category | default: "Reportagem" | escape }}</p><h1>{{ page.title | escape }}</h1><p class="intro">{{ page.description | escape }}</p><p class="meta">Por {{ page.author | escape }} · {{ page.date | date: "%d/%m/%Y" }}</p>{% if page.cover and page.cover != "" %}<figure><img src="{{ page.cover | escape }}" alt="{{ page.cover_alt | escape }}">{% if page.credit %}<figcaption>{{ page.credit | escape }}</figcaption>{% endif %}</figure>{% endif %}<div class="body">{{ content }}</div></article>
