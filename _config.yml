title: Escutativa
description: "Histórias ouvidas. Novos capítulos. Jornalismo, pessoas e direitos."
url: "https://oescutativa.com.br"
baseurl: ""
editor_url: "https://app.pagescms.org/iarleyoliveira/ESCUTATIVA/main/collection/materias"
lang: pt-BR
timezone: America/Sao_Paulo
future: true
markdown: kramdown
plugins:
  - jekyll-sitemap
collections:
  materias:
    output: true
    permalink: /materias/:name/
defaults:
  - scope:
      path: ""
      type: materias
    values:
      layout: materia
      published: false
  - scope:
      path: _materias/leia
      type: materias
    values:
      category: Reportagem
  - scope:
      path: _materias/assista
      type: materias
    values:
      category: Minidocumentário
  - scope:
      path: _materias/escute
      type: materias
    values:
      category: Podcast
exclude:
  - output
  - preview.ps1
  - README.md
  - Gemfile
  - Gemfile.lock
