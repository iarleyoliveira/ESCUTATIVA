media:
  input: assets/uploads
  output: /ESCUTATIVA/assets/uploads
content:
  - name: materias
    label: Publicações
    type: collection
    path: _materias
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [title, category, date, published]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Resumo
        type: text
        required: true
      - name: author
        label: Autor ou autores
        type: string
      - name: date
        label: Data
        type: date
        required: true
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values: [Reportagem, Entrevista, Bastidores, Minidocumentário, Videocast]
      - name: cover
        label: Imagem de capa
        type: image
      - name: cover_alt
        label: Descrição da imagem para acessibilidade
        type: string
      - name: credit
        label: Crédito da imagem
        type: string
      - name: credits
        label: Créditos da publicação
        type: text
      - name: youtube_id
        label: ID do vídeo no YouTube
        type: string
        description: "Informe os 11 caracteres do ID do vídeo. Para uma publicação de texto, deixe em branco."
        pattern:
          regex: "^([A-Za-z0-9_-]{11})?$"
          message: "Informe apenas o ID de 11 caracteres do YouTube."
      - name: published
        label: Publicar no site
        type: boolean
        default: false
        description: "Desativado: rascunho fora do site. Atenção: os arquivos do repositório são públicos."
      - name: body
        label: Texto da publicação
        type: rich-text
  - name: identidade
    label: Identidade
    type: file
    path: _data/identidade.yml
    operations:
      delete: false
    fields:
      - name: name
        label: "Nome do projeto"
        type: string
      - name: signature
        label: "Assinatura"
        type: string
      - name: topics
        label: "Temas do cabeçalho"
        type: string
      - name: format
        label: "Identificação do projeto"
        type: string
      - name: description
        label: "Descrição para buscadores"
        type: text
      - name: team_link
        label: "Link da área da equipe"
        type: string
      - name: logo
        label: "Logotipo alternativo"
        type: image
  - name: inicio
    label: Página inicial e créditos
    type: file
    path: _data/inicio.yml
    operations:
      delete: false
    fields:
      - name: title
        label: "Título da página"
        type: string
      - name: hero
        label: "Abertura"
        type: object
        fields:
          - name: kicker
            label: "Chamada"
            type: string
          - name: title
            label: "Primeira linha do título"
            type: string
          - name: accent
            label: "Linha em destaque"
            type: string
          - name: description
            label: "Apresentação"
            type: text
          - name: button
            label: "Texto do botão"
            type: string
          - name: quote
            label: "Frase em destaque"
            type: text
      - name: materias
        label: "Reportagem"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: entrevistas
        label: "Entrevista"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: bastidores
        label: "Bastidores"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: documentario
        label: "Minidocumentário"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: videocast
        label: "Videocast"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: projeto
        label: "Sobre o projeto"
        type: object
        fields:
          - name: nav
            label: "Menu"
            type: string
          - name: kicker
            label: "Chamada"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: presentation
            label: "Apresentação"
            type: rich-text
          - name: credits_title
            label: "Título dos créditos"
            type: string
          - name: credits
            label: "Créditos"
            type: rich-text
      - name: read_more
        label: "Link para abrir publicação"
        type: string
      - name: video_summary
        label: Chamada do vídeo em preparação
        type: string
      - name: video_pending
        label: "Aviso de vídeo em preparação"
        type: string
      - name: byline
        label: "Rótulo antes da autoria"
        type: string
      - name: back
        label: "Link de volta à seção"
        type: string
      - name: continue
        label: Link ao fim da publicação
        type: string
