media:
  input: assets/uploads
  output: /ESCUTATIVA/assets/uploads
content:
  - name: fotos_casos
    label: Fotos dos casos
    type: file
    path: _data/fotos_casos.yml
    operations:
      delete: false
    fields:
      - name: caso-hillary
        label: Caso Hillary Souza Valadares
        type: object
        fields:
          - name: fotos
            label: Fotos
            type: object
            list: true
            fields:
              - name: imagem
                label: Foto
                type: image
              - name: descricao
                label: Descrição da imagem
                type: string
              - name: credito
                label: Crédito da foto
                type: string
      - name: caso-canadense-cal
        label: Caso Karl Andre Van Roon
        type: object
        fields:
          - name: fotos
            label: Fotos
            type: object
            list: true
            fields:
              - name: imagem
                label: Foto
                type: image
              - name: descricao
                label: Descrição da imagem
                type: string
              - name: credito
                label: Crédito da foto
                type: string
      - name: caso-felipe
        label: Caso Felipe Rodrigues da Silva Ribeiro
        type: object
        fields:
          - name: fotos
            label: Fotos
            type: object
            list: true
            fields:
              - name: imagem
                label: Foto
                type: image
              - name: descricao
                label: Descrição da imagem
                type: string
              - name: credito
                label: Crédito da foto
                type: string
  - name: reportagens_casos
    label: Reportagens dos casos
    type: file
    path: _data/reportagens_casos.yml
    operations:
      delete: false
    fields:
      - name: reportagens
        label: Reportagens
        type: object
        list: true
        fields:
          - name: caso
            label: Caso
            type: select
            required: true
            options:
              values: [Caso Hillary Souza Valadares, Caso Karl Andre Van Roon, Caso Felipe Rodrigues da Silva Ribeiro]
          - name: formato
            label: Formato
            type: select
            required: true
            options:
              values: [Texto, Vídeo]
          - name: title
            label: Título
            type: string
            required: true
          - name: veiculo
            label: Veículo
            type: string
            required: true
          - name: resumo
            label: Resumo da reportagem
            type: text
            description: "Frase que explica o assunto da reportagem e aparece abaixo do título no site."
          - name: link
            label: Link da matéria original
            type: string
            required: true
            pattern:
              regex: "^https?://[^\\s]+$"
              message: "Cole o endereço completo da matéria, começando com https:// ou http://."
          - name: published
            label: Publicar no site
            type: boolean
            default: false
            description: "Ative e salve para exibir a reportagem no caso escolhido após a atualização do site."
  - name: comentarios
    label: Comentários
    type: file
    path: _data/comentarios.yml
    fields:
      - name: provider
        label: Serviço de comentários
        type: select
        options:
          values: [giscus, disqus]
      - name: disqus_shortname
        label: Identificador do site no Disqus (shortname)
        type: string
        description: "Antes de selecionar disqus, cadastre o site, habilite Guest Commenting em Settings → Moderation e configure a aprovação prévia dos comentários."
        pattern:
          regex: "^([A-Za-z0-9][A-Za-z0-9-]*)?$"
          message: "Use o identificador do Disqus, com letras, números e hífens."
      - name: repo
        label: Repositório do Giscus
        type: string
      - name: repo_id
        label: ID do repositório do Giscus
        type: string
      - name: category
        label: Categoria do Giscus
        type: string
      - name: category_id
        label: ID da categoria do Giscus
        type: string
  - name: materias
    label: Publicações
    type: collection
    path: _materias
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [title, category, date, published]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Resumo
        type: text
        required: true
      - name: author
        label: Autor ou autores
        type: string
      - name: date
        label: Data
        type: date
        required: true
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values: [Reportagem, Entrevista, Bastidores, Minidocumentário, Podcast]
      - name: cover
        label: Imagem de capa
        type: image
      - name: cover_alt
        label: Descrição da imagem para acessibilidade
        type: string
      - name: cover_fit
        label: Exibição da capa
        type: select
        default: cover
        options:
          values: [cover, contain]
        description: "cover preenche o espaço com recorte. contain mostra a imagem inteira, indicado para cartazes."
      - name: share_image
        label: Imagem para compartilhamento
        type: image
        description: "Opcional. Prefira 1200 × 630 pixels. Se estiver vazia, será usada a capa ou a imagem do Escutativa."
      - name: cover_caption
        label: Legenda da imagem de capa
        type: string
      - name: credit
        label: Crédito da imagem
        type: string
      - name: credits
        label: Créditos da publicação
        type: text
      - name: audio_url
        label: Arquivo de áudio do podcast
        type: string
        description: "Endereço completo do MP3 ou caminho do áudio enviado para a biblioteca."
      - name: youtube_id
        label: ID do vídeo no YouTube
        type: string
        description: "Informe os 11 caracteres do ID do vídeo. Para uma publicação de texto, deixe em branco."
        pattern:
          regex: "^([A-Za-z0-9_-]{11})?$"
          message: "Informe apenas o ID de 11 caracteres do YouTube."
      - name: published
        label: Publicar no site
        type: boolean
        default: false
        description: "Desativado: rascunho fora do site. Atenção: os arquivos do repositório são públicos."
      - name: body
        label: Texto da publicação
        type: rich-text
  - name: identidade
    label: Identidade
    type: file
    path: _data/identidade.yml
    operations:
      delete: false
    fields:
      - name: name
        label: "Nome do projeto"
        type: string
      - name: signature
        label: "Assinatura"
        type: string
      - name: topics
        label: "Temas do cabeçalho"
        type: string
      - name: format
        label: "Identificação do projeto"
        type: string
      - name: description
        label: "Descrição para buscadores"
        type: text
      - name: team_link
        label: "Link da área da equipe"
        type: string
      - name: logo
        label: "Logotipo alternativo"
        type: image
  - name: inicio
    label: Página inicial e créditos
    type: file
    path: _data/inicio.yml
    operations:
      delete: false
    fields:
      - name: title
        label: "Título da página"
        type: string
      - name: hero
        label: "Abertura"
        type: object
        fields:
          - name: kicker
            label: "Chamada"
            type: string
          - name: title
            label: "Primeira linha do título"
            type: string
          - name: accent
            label: "Linha em destaque"
            type: string
          - name: description
            label: "Apresentação"
            type: text
          - name: button
            label: "Texto do botão"
            type: string
          - name: quote
            label: "Frase em destaque"
            type: text
      - name: materias
        label: "Reportagem"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: entrevistas
        label: "Entrevista"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: bastidores
        label: "Bastidores"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: documentario
        label: "Minidocumentário"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: videocast
        label: "Podcast"
        type: object
        fields:
          - name: action
            label: Chamada da publicação
            type: string
          - name: nav
            label: "Menu e categoria"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: empty
            label: "Mensagem sem publicações"
            type: text
      - name: projeto
        label: "Sobre o projeto"
        type: object
        fields:
          - name: nav
            label: "Menu"
            type: string
          - name: kicker
            label: "Chamada"
            type: string
          - name: title
            label: "Título"
            type: string
          - name: presentation
            label: "Apresentação"
            type: rich-text
          - name: credits_title
            label: "Título dos créditos"
            type: string
          - name: credits
            label: "Créditos"
            type: rich-text
      - name: read_more
        label: "Link para abrir publicação"
        type: string
      - name: video_summary
        label: Chamada do vídeo em preparação
        type: string
      - name: video_pending
        label: "Aviso de vídeo em preparação"
        type: string
      - name: byline
        label: "Rótulo antes da autoria"
        type: string
      - name: back
        label: "Link de volta à seção"
        type: string
      - name: continue
        label: Link ao fim da publicação
        type: string
      - name: destaque
        label: Publicação em destaque
        type: object
        fields:
          - name: publication
            label: Escolher publicação
            type: reference
            description: Selecione uma publicação no ar. Limpe o campo para voltar a mostrar a frase da abertura.
            options:
              collection: materias
              value: "{path}"
              label: "{primary}"
          - name: kicker
            label: Chamada acima do título
            type: string
          - name: title
            label: Título alternativo
            type: string
          - name: description
            label: Resumo alternativo
            type: text
          - name: cover
            label: Foto alternativa
            type: image
          - name: cover_alt
            label: Descrição da foto alternativa
            type: string
      - name: acervo
        label: Acervo
        type: object
        fields:
          - name: nav
            label: Rótulo no menu
            type: string
          - name: title
            label: Título
            type: string
          - name: description
            label: Apresentação
            type: text
          - name: all
            label: Rótulo para todas as categorias
            type: string
          - name: filter
            label: Rótulo dos filtros
            type: string
          - name: more
            label: Link da inicial para o acervo
            type: string

  - name: equipe
    label: Equipe, redes e contatos
    type: file
    path: _data/equipe.yml
    fields:
      - name: title
        label: Título da seção
        type: string
      - name: description
        label: Apresentação
        type: text
      - name: members
        label: Integrantes
        type: object
        list: true
        fields:
          - name: name
            label: Nome
            type: string
          - name: role
            label: Função
            type: string
          - name: bio
            label: Biografia curta
            type: text
          - name: portrait
            label: Caricatura
            type: image
          - name: url
            label: Link pessoal
            type: string
      - name: socials
        label: Redes sociais
        type: object
        list: true
        fields:
          - name: name
            label: Nome da rede
            type: string
          - name: url
            label: Endereço completo
            type: string
      - name: contact
        label: E-mail de contato
        type: string
      - name: advertising
        label: E-mail para anúncios
        type: string
