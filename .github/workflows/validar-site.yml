name: Validar site editorial
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Instalar Jekyll do GitHub Pages
        run: gem install github-pages --no-document
      - name: Verificar formulários e preparar publicações de teste
        run: |
          ruby -ryaml <<'RUBY'
          cms = YAML.safe_load_file('.pages.yml').fetch('content')
          categories = YAML.safe_load_file('_data/categorias.yml')
          publication = cms.find { |entry| entry['type'] == 'collection' }
          field = publication.fetch('fields').find { |item| item['name'] == 'category' }
          abort 'Categorias divergentes' unless field.dig('options', 'values') == categories.map { |item| item.fetch('name') }
          def validate_fields(fields, data)
            names = fields.map { |field| field.fetch('name') }
            abort 'Campos do CMS e conteúdo divergentes' unless (data.keys - names).empty?
            fields.select { |field| field['required'] }.each do |field|
              abort "Campo obrigatório ausente: #{field['name']}" unless data.key?(field.fetch('name'))
            end
            fields.select { |field| field['type'] == 'object' }.each do |field|
              value = data[field.fetch('name')]
              next if value.nil?
              if field['list']
                value.each { |item| validate_fields(field.fetch('fields'), item) }
              else
                validate_fields(field.fetch('fields'), value)
              end
            end
          end
          cms.select { |entry| entry['type'] == 'file' }.each do |entry|
            validate_fields(entry.fetch('fields'), YAML.safe_load_file(entry.fetch('path')))
          end
          File.write('_materias/validacao-capa.md', <<~POST)
            ---
            title: Vídeo com capa de teste
            description: Sinopse de teste
            date: 2020-01-01
            category: Podcast
            cover: /ESCUTATIVA/assets/icon.svg
            cover_alt: Ícone do projeto
            published: true
            ---
          POST
          categories.each_with_index do |category, index|
            File.write("_materias/validacao-#{index}.md", <<~POST)
              ---
              title: Publicação de teste #{index}
              description: Resumo de teste
              author: Equipe de teste
              date: 2020-01-01
              category: #{category.fetch('name')}
              published: true
              #{'youtube_id: M7lc1UVf-VE' if category['video']}
              ---
              Corpo da publicação.
            POST
          end
          File.write('_materias/validacao-rascunho.md', "---\ntitle: Rascunho de teste\ncategory: Reportagem\npublished: false\n---\n")
          cases = YAML.safe_load_file('_data/casos.yml').map { |item| item.fetch('name') }
          case_cms = cms.find { |entry| entry['name'] == 'reportagens_casos' }
          case_fields = case_cms.fetch('fields').first.fetch('fields')
          abort 'Casos divergentes no CMS' unless case_fields.find { |field| field['name'] == 'caso' }.dig('options', 'values') == cases
          reports = cases.first(2).each_with_index.map do |name, index|
            { 'caso' => name, 'formato' => ['Texto', 'Vídeo'][index], 'title' => "Matéria original #{index}",
              'veiculo' => "Veículo #{index}", 'link' => "https://example.com/reportagem-#{index}", 'published' => true }
          end
          reports << reports.first.merge('title' => 'Rascunho do caso', 'published' => false)
          reports << reports.first.merge('title' => 'Link inválido do caso', 'link' => 'javascript:alert(1)')
          File.write('_data/reportagens_casos.yml', { 'reportagens' => reports }.to_yaml)
          RUBY
      - name: Gerar site com Jekyll
        run: jekyll build --strict_front_matter
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar navegação, sitemap e layout no celular
        run: |
          mkdir -p /tmp/escutativa-preview
          ln -s "$PWD/_site" /tmp/escutativa-preview/ESCUTATIVA
          python -m http.server 8000 --directory /tmp/escutativa-preview &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8000/ESCUTATIVA/ -o /dev/null
          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          root = 'http://127.0.0.1:8000/ESCUTATIVA/'
          sections = ['materias', 'entrevistas', 'bastidores', 'documentario', 'videocast']
          sitemap = Path('_site/sitemap.xml').read_text()
          assert '/ESCUTATIVA/acervo/' in sitemap
          assert 'validacao-rascunho' not in sitemap
          assert not list(Path('_site').rglob('*validacao-rascunho*'))

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              page.route('https://www.youtube-nocookie.com/**', lambda route: route.abort())
              for width in [320, 390, 1280]:
                  page.set_viewport_size({'width': width, 'height': 850})
                  page.goto(root)
                  page.locator('.search-link').click()
                  expect(page.get_by_role('dialog')).to_be_visible()
                  expect(page.locator('#quick-search-query')).to_be_focused()
                  page.keyboard.press('Escape')
                  expect(page.get_by_role('dialog')).to_be_hidden()
                  expect(page.locator('.search-link')).to_be_focused()
                  page.locator('.search-link').click()
                  page.locator('#quick-search-query').fill('Equipe de teste')
                  page.locator('.quick-search').get_by_role('button', name='Buscar').click()
                  expect(page.locator('#search-status')).to_contain_text('5 publicações')
                  page.goto(root)
                  expect(page.locator('meta[name="google-site-verification"]')).to_have_attribute(
                      'content', 'k3ZHhVNUdvAijnVMVd8QVD-enngPZGUcz9113uLSEwU'
                  )
                  expect(page.locator('#assista h2')).to_have_text('Quando a notícia faz parte da história.')
                  cases_link = page.locator('header nav').get_by_role('link', name='Casos', exact=True)
                  expect(cases_link).to_have_attribute('href', '/ESCUTATIVA/#casos')
                  cases_link.click()
                  expect(page.locator('#casos')).to_be_visible()
                  expect(page.locator('#casos h3')).to_have_text(['Caso Hillary Souza Valadares', 'Caso Karl Andre Van Roon', 'Caso Felipe Rodrigues da Silva Ribeiro'])
                  expect(page.locator('#casos h4')).to_have_text(['Matérias completas'] * 3)
                  for index, case_id in enumerate(['caso-hillary', 'caso-canadense-cal']):
                      block = page.locator(f'article[aria-labelledby="{case_id}"]')
                      link = block.get_by_role('link', name=f'Matéria original {index}', exact=False)
                      expect(link).to_have_attribute('href', f'https://example.com/reportagem-{index}')
                      expect(link).to_have_attribute('target', '_blank')
                      expect(link).to_have_attribute('rel', 'noopener noreferrer')
                      expect(block.locator('.case-report p')).to_contain_text(f'Veículo {index}')
                      expect(block.locator('.case-format')).to_have_text(['Texto', 'Vídeo'][index])
                  expect(page.locator('article[aria-labelledby="caso-felipe"] .case-empty')).to_be_visible()
                  expect(page.get_by_text('Rascunho do caso')).to_have_count(0)
                  expect(page.get_by_text('Link inválido do caso')).to_have_count(0)
                  expect(page.get_by_text('Rascunho de teste')).to_have_count(0)
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  assert min(page.locator('nav a').evaluate_all('(links) => links.map(link => link.offsetHeight)')) >= 44
                  expect(page.locator('#assista').get_by_role('link', name='Quando a escuta abre caminhos', exact=False)).to_be_visible()
                  expect(page.locator('.hero-feature h2')).to_have_text('Black Charme Ice')
                  expect(page.locator('.home-hero')).not_to_contain_text('Nossa pauta são as pessoas')
                  expect(page.locator('#contato a').first).to_have_attribute('href', 'mailto:escutativanews@gmail.com')
                  expect(page.locator('.login-link')).to_have_attribute('href', 'https://app.pagescms.org/iarleyoliveira/ESCUTATIVA/main/collection/materias')
                  expect(page.locator('.footer-socials').get_by_role('link', name='Facebook', exact=False)).to_have_attribute('href', 'https://www.facebook.com/profile.php?id=61596955162786')
                  archive = page.locator('#leia a.section-archive')
                  expect(archive).to_have_attribute('href', '/ESCUTATIVA/acervo/?formato=leia')
                  archive.click()
                  expect(page.locator('[data-category="materias"]')).to_be_visible()
                  expect(page.locator('[data-category="entrevistas"]')).to_be_visible()
                  page.get_by_role('button', name='Entrevistas').click()
                  expect(page.locator('[data-category="entrevistas"]')).to_be_visible()
                  expect(page.locator('[data-category="materias"]')).to_be_hidden()
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  page.get_by_role('button', name='Todas').click()
                  expect(page.locator('[data-category="materias"]')).to_be_visible()
                  expect(page.get_by_text('Rascunho de teste')).to_have_count(0)
                  page.goto(root)
                  expect(page.locator('main .format-section')).to_have_count(3)
                  for index, section_id in enumerate(sections):
                      section = page.locator(f'[data-publication-category="{section_id}"]')
                      for label, target in [("Leia", "leia"), ("Assista", "assista"), ("Escute", "escute")]:
                          expect(page.locator('header nav').get_by_role("link", name=label, exact=True)).to_have_attribute("href", f"/ESCUTATIVA/acervo/?formato={target}")
                      link = section.get_by_role('link', name=f'Publicação de teste {index}', exact=False).first
                      expect(link).to_be_visible()
                      path = link.get_attribute('href')
                      assert path in sitemap
                      if index == 0:
                          expect(link.locator('.text-action')).to_contain_text('Ler reportagem')
                      if index == 1:
                          expect(link.locator('.text-action')).to_contain_text('Ler entrevista')
                      if index >= 3:
                          expect(section.locator('iframe').first).to_have_attribute(
                              'src', 'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE'
                          )
                      page.goto('http://127.0.0.1:8000' + path)
                      expect(page.get_by_role('heading', level=1)).to_have_text(f'Publicação de teste {index}')
                      expect(page.locator('.article-end a')).to_have_attribute('href', f'/ESCUTATIVA/#{section_id}')
                      assert page.evaluate('document.documentElement.scrollWidth') <= width
                      page.goto(root)
                  page.goto(root + 'acervo/?formato=escute')
                  expect(page.locator('[data-category="videocast"]')).to_be_visible()
                  expect(page.locator('[data-category="materias"]')).to_be_hidden()
                  page.get_by_role('button', name='Todas', exact=True).click()
                  page.get_by_role('searchbox').fill('Equipe de teste')
                  page.get_by_role('button', name='Buscar', exact=True).click()
                  expect(page.locator('#search-status')).to_contain_text('5 publicações')
                  page.get_by_role('searchbox').fill('termo-sem-resultados')
                  page.get_by_role('button', name='Buscar', exact=True).click()
                  expect(page.locator('#search-status')).to_contain_text('Nenhuma publicação')
                  page.go_back()
                  expect(page.get_by_role('searchbox')).to_have_value('Equipe de teste')
                  page.goto(root)
                  existing = page.locator('#leia').get_by_role('link', name='Black Charme Ice', exact=False)
                  expect(existing).to_be_visible()
                  assert existing.get_attribute('href') in sitemap
                  existing.click()
                  expect(page.get_by_role('heading', level=1)).to_have_text('Black Charme Ice')
                  page.wait_for_function('document.querySelector("figure img").naturalWidth > 0')
                  if page.evaluate('document.documentElement.scrollWidth') > width:
                      print(page.evaluate('Array.from(document.querySelectorAll("body *")).map(e => ({tag:e.tagName, cls:e.className, width:e.getBoundingClientRect().width, right:e.getBoundingClientRect().right})).filter(e => e.right > innerWidth || e.width > innerWidth)'), flush=True)
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  expect(page.locator('meta[property="og:type"]')).to_have_attribute('content', 'article')
                  expect(page.locator('meta[property="og:image"]')).to_have_attribute(
                      'content', 'https://iarleyoliveira.github.io/ESCUTATIVA/assets/social/black-charme-ice.png'
                  )
                  current_path = page.url.split('8000')[-1]
                  related_links = page.locator('.related-publications .card-link').evaluate_all(
                      '(links) => links.map(link => link.getAttribute("href"))'
                  )
                  assert current_path not in related_links
                  assert len(related_links) == len(set(related_links))
                  assert related_links[0] == '/ESCUTATIVA/materias/validacao-0/'
                  page.goto(root + 'materias/conversas-que-aproximam/')
                  expect(page.locator('.video-poster img')).to_be_visible()
                  expect(page.locator('.article .intro')).to_contain_text('O que acontece antes de uma notícia chegar ao público?')
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
              page.emulate_media(reduced_motion='reduce')
              page.goto(root)
              page.locator('#quem-faz').scroll_into_view_if_needed()
              assert page.evaluate('document.getAnimations().length') == 0
              expect(page.locator('.team-member').first).to_be_visible()
          PY
