name: Validar site editorial
on:
  pull_request:
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto do Pages CMS
        required: false
        type: string

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Instalar Jekyll do GitHub Pages
        run: gem install github-pages --no-document
      - name: Verificar formulários e preparar publicações de teste
        run: |
          ruby -ryaml -rdate <<'RUBY'
          def content_entries(entries)
            entries.flat_map { |entry| entry['type'] == 'group' ? content_entries(entry.fetch('items')) : [entry] }
          end
          cms = content_entries(YAML.safe_load_file('.pages.yml').fetch('content'))
          categories = YAML.safe_load_file('_data/categorias.yml')
          collections = cms.select { |entry| entry['type'] == 'collection' }
          field_categories = collections.flat_map { |entry| entry.fetch('fields').find { |item| item['name'] == 'category' }.dig('options', 'values') }
          abort 'Categorias divergentes' unless field_categories == categories.map { |item| item.fetch('name') }
          podcast = collections.find { |entry| entry['name'] == 'escute' }
          abort 'Envio de áudio indisponível' unless podcast.fetch('fields').find { |item| item['name'] == 'audio_url' }['type'] == 'file'
          abort 'Campos de áudio em Leia' if collections.find { |entry| entry['name'] == 'materias' }.fetch('fields').any? { |item| item['name'] == 'audio_url' }
          abort 'Campos de áudio em Assista' if collections.find { |entry| entry['name'] == 'assista' }.fetch('fields').any? { |item| item['name'] == 'audio_url' }
          def validate_fields(fields, data)
            names = fields.map { |field| field.fetch('name') }
            abort 'Campos do CMS e conteúdo divergentes' unless (data.keys - names).empty?
            fields.select { |field| field['required'] }.each do |field|
              abort "Campo obrigatório ausente: #{field['name']}" unless data.key?(field.fetch('name'))
            end
            fields.select { |field| field['type'] == 'object' }.each do |field|
              value = data[field.fetch('name')]
              next if value.nil?
              if field['list']
                value.each { |item| validate_fields(field.fetch('fields'), item) }
              else
                validate_fields(field.fetch('fields'), value)
              end
            end
          end
          cms.select { |entry| entry['type'] == 'file' }.each do |entry|
            data = YAML.safe_load_file(entry.fetch('path'))
            if entry['list']
              data.each { |item| validate_fields(entry.fetch('fields'), item) }
            else
              validate_fields(entry.fetch('fields'), data)
            end
          end
          current_cases = YAML.safe_load_file('_data/casos.yml')
          case_ids = current_cases.map { |entry| entry['id'].to_s.empty? ? entry.fetch('name').downcase.gsub(/[^a-z0-9]+/, '-') : entry['id'] }
          abort 'Existem casos com identificadores repetidos' unless case_ids.uniq.length == case_ids.length
          Dir.glob('_materias/**/*.md').each do |path|
            front = File.read(path).match(/\A---\s*\n(.*?)\n---/m)
            abort "Publicação sem cabeçalho: #{path}" unless front
            data = YAML.safe_load(front[1], permitted_classes: [Date, Time])
            if data['published'] == true
              abort "Categoria inválida em #{path}" unless categories.any? { |category| category['name'] == data['category'] }
              %w[title description date].each { |key| abort "Campo #{key} ausente em #{path}" if data[key].to_s.strip.empty? }
            end
          end
          # Os testes usam somente publicações de exemplo no checkout temporário do CI.
          Dir.glob('_materias/**/*.md').each { |path| File.delete(path) }
          File.write('_materias/2026-11-12-black-charme-ice.md', {
            'title' => 'Black Charme Ice', 'description' => 'Reportagem de teste editorial', 'date' => '2026-11-12',
            'category' => 'Reportagem', 'author' => 'Circy Shara', 'cover' => '/assets/icon.svg',
            'share_image' => '/assets/social/black-charme-ice.png', 'published' => true
          }.to_yaml + "---\nCorpo da reportagem de teste.\n")
          File.write('_materias/conversas-que-aproximam.md', {
            'title' => 'Conversas que aproximam', 'description' => 'O que acontece antes de uma notícia chegar ao público?', 'date' => '2026-11-12',
            'category' => 'Podcast', 'cover' => '/assets/icon.svg', 'published' => true
          }.to_yaml + "---\n")
          File.write('_materias/quando-a-escuta-abre-caminhos.md', {
            'title' => 'Quando a escuta abre caminhos', 'description' => 'Sinopse de teste', 'date' => '2026-11-12',
            'category' => 'Minidocumentário', 'published' => true
          }.to_yaml + "---\n")
          team = YAML.safe_load_file('_data/equipe.yml')
          team['contact'] = 'escutativanews@gmail.com'
          team['socials'] = [{ 'name' => 'Facebook', 'url' => 'https://www.facebook.com/profile.php?id=61596955162786' }]
          File.write('_data/equipe.yml', team.to_yaml)
          File.write('_materias/validacao-capa.md', <<~POST)
            ---
            title: Vídeo com capa de teste
            description: Sinopse de teste
            date: 2020-01-01
            category: Podcast
            cover: /assets/icon.svg
            cover_alt: Ícone do projeto
            published: true
            ---
          POST
          categories.each_with_index do |category, index|
            File.write("_materias/validacao-#{index}.md", <<~POST)
              ---
              title: Publicação de teste #{index}
              description: Resumo de teste
              author: Equipe de teste
              date: 2031-01-01
              category: #{category.fetch('name')}
              published: true
              #{'youtube_id: "https://youtu.be/M7lc1UVf-VE?si=teste"' if index == 3}
              #{'youtube_id: "https://www.youtube.com/watch?v=M7lc1UVf-VE&feature=youtu.be"' if index == 4}
              ---
              Corpo da publicação.
            POST
          end
          File.write('_materias/validacao-rascunho.md', "---\ntitle: Rascunho de teste\ncategory: Reportagem\npublished: false\n---\n")
          pcm = ([0] * 1600).pack('s<*')
          wav = 'RIFF' + [36 + pcm.bytesize].pack('V') + 'WAVEfmt ' + [16, 1, 1, 8000, 16000, 2, 16].pack('VvvVVvv') + 'data' + [pcm.bytesize].pack('V') + pcm
          File.binwrite('assets/uploads/validacao-audio.wav', wav)
          {
            'audio-local' => { 'audio_url' => '/assets/uploads/validacao-audio.wav' },
            'audio-prefixo' => { 'audio_url' => '/assets/uploads/validacao-audio.wav' },
            'audio-externo' => { 'audio_url' => '', 'audio_link' => 'https://example.com/episodio.mp3' },
            'midia-vazia' => { 'audio_url' => '', 'youtube_id' => '' }
          }.each do |slug, media|
            fixture = { 'title' => "Teste #{slug}", 'description' => 'Teste dos campos de mídia', 'date' => '2030-01-01', 'category' => 'Podcast', 'cover' => '/assets/icon.svg', 'published' => true }.merge(media)
            File.write("_materias/validacao-#{slug}.md", fixture.to_yaml + "---\n")
          end
          Dir.mkdir('_materias/escute') unless Dir.exist?('_materias/escute')
          File.write('_materias/escute/validacao-categoria-automatica.md', {
            'title' => 'Podcast com categoria automática', 'description' => 'Teste do cadastro pela aba Escute',
            'date' => '2029-01-01', 'published' => true
          }.to_yaml + "---\n")
          cases = [
            { 'name' => 'Caso Hillary Souza Valadares', 'id' => 'caso-hillary', 'published' => true },
            { 'name' => 'Caso Karl Andre Van Roon', 'id' => 'caso-canadense-cal', 'published' => true },
            { 'name' => 'Caso Felipe Rodrigues da Silva Ribeiro', 'id' => 'caso-felipe', 'published' => true }
          ]
          cases[0]['fotos'] = [{ 'imagem' => '/assets/icon.svg', 'descricao' => 'Foto única do caso' }]
          cases[1]['fotos'] = (1..5).map { |index| { 'imagem' => '/assets/icon.svg', 'descricao' => "Foto de teste #{index}" } }
          cases.each_with_index do |entry, index|
            entry['reportagens'] = if index < 2
              [{ 'formato' => ['Texto', 'Vídeo'][index], 'title' => "Matéria original #{index}",
                 'veiculo' => "Veículo #{index}", 'resumo' => "Resumo da reportagem #{index}", 'link' => "https://example.com/reportagem-#{index}", 'published' => true }]
            else
              []
            end
          end
          sample = cases.first.fetch('reportagens').first
          cases.first['reportagens'] << sample.merge('title' => 'Rascunho do caso', 'published' => false)
          cases.first['reportagens'] << sample.merge('title' => 'Link inválido do caso', 'link' => 'javascript:alert(1)')
          cases[2].delete('id')
          cases << { 'name' => 'Caso de rascunho', 'id' => 'caso-rascunho', 'published' => false }
          File.write('_data/casos.yml', cases.to_yaml)
          home = YAML.safe_load_file('_data/inicio.yml')
          escute = YAML.safe_load_file('_data/escute.yml')
          escute['description'] = 'Descrição editada no Pages'
          File.write('_data/escute.yml', escute.to_yaml)
          assista = YAML.safe_load_file('_data/assista.yml')
          assista['title'] = 'Quando a notícia faz parte da história.'
          File.write('_data/assista.yml', assista.to_yaml)
          leia = YAML.safe_load_file('_data/leia.yml')
          leia['materias']['action'] = 'Ler reportagem'
          leia['entrevistas']['action'] = 'Ler entrevista'
          leia['entrevistas']['nav'] = 'Entrevistas'
          File.write('_data/leia.yml', leia.to_yaml)
          home['destaque'] = { 'publication' => '_materias/2026-11-12-black-charme-ice.md', 'kicker' => 'Em destaque' }
          File.write('_data/inicio.yml', home.to_yaml)
          RUBY
      - name: Gerar site com Jekyll
        run: jekyll build --strict_front_matter
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar navegação, sitemap e layout no celular
        run: |
          python -m http.server 8000 --directory _site &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8000/ -o /dev/null
          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import expect, sync_playwright

          root = 'http://127.0.0.1:8000/'
          sections = ['materias', 'entrevistas', 'bastidores', 'documentario', 'videocast']
          sitemap = Path('_site/sitemap.xml').read_text()
          assert '/acervo/' in sitemap
          assert 'validacao-rascunho' not in sitemap
          assert not list(Path('_site').rglob('*validacao-rascunho*'))

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              page.route('https://www.youtube-nocookie.com/**', lambda route: route.abort())
              for width in [320, 390, 1280]:
                  page.set_viewport_size({'width': width, 'height': 850})
                  page.goto(root)
                  page.locator('.search-link').click()
                  expect(page.get_by_role('dialog')).to_be_visible()
                  expect(page.locator('#quick-search-query')).to_be_focused()
                  page.keyboard.press('Escape')
                  expect(page.get_by_role('dialog')).to_be_hidden()
                  expect(page.locator('.search-link')).to_be_focused()
                  page.locator('.search-link').click()
                  page.locator('#quick-search-query').fill('Equipe de teste')
                  page.locator('.quick-search').get_by_role('button', name='Buscar').click()
                  expect(page.locator('#search-status')).to_contain_text('5 publicações')
                  page.goto(root)
                  expect(page.locator('meta[name="google-site-verification"]')).to_have_attribute(
                      'content', 'k3ZHhVNUdvAijnVMVd8QVD-enngPZGUcz9113uLSEwU'
                  )
                  expect(page.locator('#assista h2')).to_have_text('Quando a notícia faz parte da história.')
                  cases_link = page.locator('header nav').get_by_role('link', name='Casos', exact=True)
                  expect(cases_link).to_have_attribute('href', '/#casos')
                  cases_link.click()
                  expect(page.locator('#casos')).to_be_visible()
                  expect(page.locator('#casos h3')).to_have_text(['Caso Hillary Souza Valadares', 'Caso Karl Andre Van Roon', 'Caso Felipe Rodrigues da Silva Ribeiro'])
                  expect(page.locator('#casos h4')).to_have_text(['Matérias completas'] * 3)
                  gallery = page.locator('[aria-labelledby="caso-canadense-cal"] [data-case-carousel]')
                  visible_photos = 3 if width >= 900 else 2 if width >= 600 else 1
                  def photo_counter(start):
                      positions = [(start + offset) % 5 + 1 for offset in range(visible_photos)]
                      return f'Foto {positions[0]} de 5' if visible_photos == 1 else 'Fotos ' + ', '.join(map(str, positions)) + ' de 5'
                  gallery.locator('.case-next').press('Home')
                  expect(gallery.locator('.case-slides > figure:visible')).to_have_count(visible_photos)
                  expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(0))
                  if width >= 900:
                      boxes = gallery.locator('.case-slides > figure:visible').evaluate_all('(items) => items.map(item => ({x:item.getBoundingClientRect().x, y:item.getBoundingClientRect().y}))')
                      assert max(item['y'] for item in boxes) - min(item['y'] for item in boxes) < 2
                      assert boxes[0]['x'] < boxes[1]['x'] < boxes[2]['x']
                  gallery.get_by_role('button', name='Próxima foto', exact=True).click()
                  expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(1))
                  gallery.get_by_role('button', name='Foto anterior', exact=True).click()
                  expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(0))
                  gallery.get_by_role('button', name='Foto anterior', exact=True).click()
                  expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(4))
                  gallery.locator('.case-next').press('Home')
                  gallery.locator('.case-next').click()
                  gallery.locator('.case-next').press('ArrowRight')
                  expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(2))
                  expect(page.locator('[aria-labelledby="caso-hillary"] .case-carousel-controls')).to_be_hidden()
                  if width == 1280:
                      gallery.locator('.case-next').press('Home')
                      gallery.get_by_role('button', name='Reproduzir fotos automaticamente', exact=True).click()
                      page.mouse.move(0, 0)
                      expect(gallery.locator('.case-photo-counter')).to_have_text(photo_counter(1), timeout=10000)
                      gallery.get_by_role('button', name='Pausar passagem automática', exact=True).click()
                      expect(gallery.get_by_role('button', name='Reproduzir fotos automaticamente', exact=True)).to_be_visible()
                  for index, case_id in enumerate(['caso-hillary', 'caso-canadense-cal']):
                      block = page.locator(f'article[aria-labelledby="{case_id}"]')
                      link = block.get_by_role('link', name=f'Matéria original {index}', exact=False)
                      expect(link).to_have_attribute('href', f'https://example.com/reportagem-{index}')
                      expect(link).to_have_attribute('target', '_blank')
                      expect(link).to_have_attribute('rel', 'noopener noreferrer')
                      expect(block.locator('.case-source')).to_contain_text(f'Veículo {index}')
                      expect(block.locator('.case-summary')).to_have_text(f'Resumo da reportagem {index}')
                      expect(block.locator('.case-format')).to_have_count(0)
                  expect(page.locator('article[aria-labelledby="caso-felipe-rodrigues-da-silva-ribeiro"] .case-empty')).to_be_visible()
                  expect(page.locator('#escute .format-heading p')).to_have_text('Descrição editada no Pages')
                  expect(page.get_by_text('Rascunho do caso')).to_have_count(0)
                  expect(page.get_by_text('Caso de rascunho')).to_have_count(0)
                  expect(page.get_by_text('Link inválido do caso')).to_have_count(0)
                  expect(page.get_by_text('Rascunho de teste')).to_have_count(0)
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  assert min(page.locator('nav a').evaluate_all('(links) => links.map(link => link.offsetHeight)')) >= 44
                  expect(page.locator('#assista').get_by_role('link', name='Quando a escuta abre caminhos', exact=False)).to_be_visible()
                  expect(page.locator('.hero-feature h2')).to_have_text('Black Charme Ice')
                  expect(page.locator('.home-hero')).not_to_contain_text('Nossa pauta são as pessoas')
                  expect(page.locator('#contato a').first).to_have_attribute('href', 'mailto:escutativanews@gmail.com')
                  expect(page.locator('.login-link')).to_have_attribute('href', 'https://app.pagescms.org/iarleyoliveira/ESCUTATIVA/main/collection/materias')
                  expect(page.locator('.footer-socials').get_by_role('link', name='Facebook', exact=False)).to_have_attribute('href', 'https://www.facebook.com/profile.php?id=61596955162786')
                  archive = page.locator('#leia a.section-archive')
                  expect(archive).to_have_attribute('href', '/acervo/?formato=leia')
                  archive.click()
                  expect(page.locator('[data-category="materias"]')).to_be_visible()
                  expect(page.locator('[data-category="entrevistas"]')).to_be_visible()
                  page.get_by_role('button', name='Entrevistas').click()
                  expect(page.locator('[data-category="entrevistas"]')).to_be_visible()
                  expect(page.locator('[data-category="materias"]')).to_be_hidden()
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  page.get_by_role('button', name='Todas').click()
                  expect(page.locator('[data-category="materias"]')).to_be_visible()
                  expect(page.get_by_text('Rascunho de teste')).to_have_count(0)
                  page.goto(root)
                  expect(page.locator('main .format-section')).to_have_count(3)
                  for index, section_id in enumerate(sections):
                      section = page.locator(f'[data-publication-category="{section_id}"]')
                      for label, target in [("Leia", "leia"), ("Assista", "assista"), ("Escute", "escute")]:
                          expect(page.locator('header nav').get_by_role("link", name=label, exact=True)).to_have_attribute("href", f"/acervo/?formato={target}")
                      link = section.get_by_role('link', name=f'Publicação de teste {index}', exact=False).first
                      expect(link).to_be_visible()
                      path = link.get_attribute('href')
                      assert path in sitemap
                      if index == 0:
                          expect(link.locator('.text-action')).to_contain_text('Ler reportagem')
                      if index == 1:
                          expect(link.locator('.text-action')).to_contain_text('Ler entrevista')
                      if index >= 3:
                          expect(section.locator('iframe').first).to_have_attribute(
                              'src', 'https://www.youtube-nocookie.com/embed/M7lc1UVf-VE'
                          )
                      page.goto('http://127.0.0.1:8000' + path)
                      expect(page.get_by_role('heading', level=1)).to_have_text(f'Publicação de teste {index}')
                      expect(page.locator('.article-end a')).to_have_attribute('href', f'/#{section_id}')
                      assert page.evaluate('document.documentElement.scrollWidth') <= width
                      page.goto(root)
                  page.goto(root + 'acervo/?formato=escute')
                  expect(page.locator('[data-category="videocast"]')).to_be_visible()
                  expect(page.locator('[data-category="materias"]')).to_be_hidden()
                  page.get_by_role('button', name='Todas', exact=True).click()
                  page.get_by_role('searchbox').fill('Equipe de teste')
                  page.get_by_role('button', name='Buscar', exact=True).click()
                  expect(page.locator('#search-status')).to_contain_text('5 publicações')
                  page.get_by_role('searchbox').fill('termo-sem-resultados')
                  page.get_by_role('button', name='Buscar', exact=True).click()
                  expect(page.locator('#search-status')).to_contain_text('Nenhuma publicação')
                  page.go_back()
                  expect(page.get_by_role('searchbox')).to_have_value('Equipe de teste')
                  page.goto(root)
                  existing = page.locator('#leia').get_by_role('link', name='Black Charme Ice', exact=False)
                  expect(existing).to_be_visible()
                  assert existing.get_attribute('href') in sitemap
                  existing.click()
                  expect(page.get_by_role('heading', level=1)).to_have_text('Black Charme Ice')
                  page.wait_for_function('document.querySelector("figure img").naturalWidth > 0')
                  if page.evaluate('document.documentElement.scrollWidth') > width:
                      print(page.evaluate('Array.from(document.querySelectorAll("body *")).map(e => ({tag:e.tagName, cls:e.className, width:e.getBoundingClientRect().width, right:e.getBoundingClientRect().right})).filter(e => e.right > innerWidth || e.width > innerWidth)'), flush=True)
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  expect(page.locator('meta[property="og:type"]')).to_have_attribute('content', 'article')
                  expect(page.locator('meta[property="og:image"]')).to_have_attribute(
                      'content', 'https://escutativa.com.br/assets/social/black-charme-ice.png'
                  )
                  current_path = page.url.split('8000')[-1]
                  related_links = page.locator('.related-publications .card-link').evaluate_all(
                      '(links) => links.map(link => link.getAttribute("href"))'
                  )
                  assert current_path not in related_links
                  assert len(related_links) == len(set(related_links))
                  assert related_links[0] == '/materias/validacao-0/'
                  page.goto(root + 'materias/conversas-que-aproximam/')
                  expect(page.locator('.video-poster img')).to_be_visible()
                  expect(page.locator('.article .intro')).to_contain_text('O que acontece antes de uma notícia chegar ao público?')
                  assert page.evaluate('document.documentElement.scrollWidth') <= width
                  for slug in ['audio-local', 'audio-prefixo', 'audio-externo']:
                      page.goto(root + f'materias/validacao-{slug}/')
                      expect(page.locator('audio.podcast-player')).to_be_visible()
                      expected_audio = 'https://example.com/episodio.mp3' if slug == 'audio-externo' else '/assets/uploads/validacao-audio.wav'
                      expect(page.locator('audio source')).to_have_attribute('src', expected_audio)
                      expect(page.locator('.article-cover img')).to_have_attribute('src', '/assets/icon.svg')
                      expect(page.locator('.video-status')).to_have_count(0)
                      if slug != 'audio-externo':
                          page.wait_for_function('document.querySelector("audio").readyState >= 1')
                      assert page.evaluate('document.documentElement.scrollWidth') <= width
                  page.goto(root + 'materias/validacao-midia-vazia/')
                  expect(page.locator('.video-status')).to_be_visible()
                  expect(page.locator('audio')).to_have_count(0)
                  page.goto(root + 'materias/validacao-categoria-automatica/')
                  expect(page.get_by_role('heading', level=1)).to_have_text('Podcast com categoria automática')
                  expect(page.locator('.article > .kicker')).to_have_text('Podcast')
                  page.goto(root + 'admin/')
                  expect(page.get_by_role('heading', name='Do painel para o site')).to_be_visible()
                  expect(page.get_by_role('link', name='Cadastrar ou editar casos')).to_have_attribute('href', 'https://app.pagescms.org/iarleyoliveira/ESCUTATIVA/main/file/casos')
              page.emulate_media(reduced_motion='reduce')
              page.goto(root)
              page.locator('#quem-faz').scroll_into_view_if_needed()
              assert page.evaluate('document.getAnimations().length') == 0
              expect(page.locator('.team-member').first).to_be_visible()
              page.locator('#casos').scroll_into_view_if_needed()
