title: "Quem faz o Escutativa"
description: "As pessoas por trás das histórias."
members:
  - name: "Circy Shara"
    role: ""
    bio: "Pernambucana que descobriu no jornalismo uma nova forma de impactar vidas. Adora conhecer pessoas e viajar por novas histórias."
    portrait: "/assets/uploads/equipe/integrante-04.jpeg"
    url: ""
  - name: "Bruna Sousa"
    role: ""
    bio: "Bruna, 26 anos, formada em Direito e apaixonada por comunicação e jornalismo. Sou uma pessoa sonhadora, curiosa por natureza e encantada pelas histórias que o mundo tem a contar. Amo música, shows, festivais, filmes antigos e tudo o que envolve arte e cultura. Também gosto de moda, roupas e de explorar diferentes formas de expressão. Gosto de conhecer novas perspectivas, descobrir histórias inesperadas e transformá-las em palavras. Afinal, acredito que sempre existe algo interessante por trás de cada história."
    portrait: "/assets/uploads/equipe/integrante-01.jpeg"
    url: ""
  - name: "Felipe Roque"
    role: ""
    bio: "Felipe Roque, 24 anos. Sou bacharel em Direito e graduando em Jornalismo. Embora tenha passado pelo Direito, foi na comunicação que encontrei meu caminho. Apaixonado por esporte, consegui unir minha profissão ao clube do coração e hoje trabalho na gestão das redes sociais do Santos Futebol Clube. Sou curioso, comunicativo e acredito no poder das boas histórias e das pessoas. Estou sempre com um sorriso no rosto e procuro levar um pouco dele às pessoas ao meu redor. Afinal, acredito que, mesmo diante das dificuldades, sempre existe um bom motivo para sorrir."
    portrait: "/assets/uploads/equipe/integrante-02.jpeg"
    url: ""
  - name: "Breno Sant’anna"
    role: ""
    bio: "Breno Sant'Anna saiu de Iguape para morar em Santos e seguir seu caminho no Jornalismo. Prefere ouvir do que falar. É quieto por fora, mas inquieto por dentro. Acredita na escrita como forma de manter memórias vivas."
    portrait: "/assets/uploads/equipe/breno-santanna.jpeg"
    url: ""
