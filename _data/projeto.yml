title: A função social do Jornalismo e a imprensa como garantia de direitos
presentation: >-
  Escutativa é um trabalho de conclusão de curso que investiga a contribuição do
  Jornalismo para a defesa dos direitos da população, a partir de histórias de
  pessoas que encontraram apoio na imprensa.


  O projeto reúne minidocumentário, podcast e reportagem escrita.
