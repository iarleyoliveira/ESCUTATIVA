    - formato: Texto
      title: Casal do Canadá descobre morte de filho em Santos, no litoral de São
        Paulo, após anos de busca; entenda
      resumo: A reportagem conta como a família encontrou Karl após anos de buscas e
        descobriu que ele havia morrido em Santos em 2024, pouco depois da
        publicação da primeira matéria.
      veiculo: A Tribuna Online
      link: https://www.atribuna.com.br/cidades/santos/casal-do-canada-descobre-morte-de-filho-em-santos-no-litoral-de-s-o-paulo-apos-anos-de-busca-entenda-1.505718
