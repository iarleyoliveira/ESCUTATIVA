      title: Canadense encontrado morto em Santos pela família tentava ir a Jerusalém
        pelo Porto sem dinheiro e sem documentos
      resumo: A reportagem apresenta os desdobramentos sobre o período em que Karl
        esteve em Santos, incluindo a tentativa de viajar a Jerusalém pelo
        porto, sem dinheiro e sem documentos.
      veiculo: A Tribuna Online
      link: https://www.atribuna.com.br/cidades/santos/canadense-encontrado-morto-em-santos-pela-familia-tentava-ir-a-jerusalem-pelo-porto-sem-dinheiro-e-sem-documentos-1.506705
