name: Caso Hillary Souza Valadares
ordem: 1
id: caso-hillary
descricao: Hillary Souza Valadares tinha dois anos quando foi atingida na cabeça
  por uma bala perdida durante uma perseguição policial em Peruíbe, em 12 de
  fevereiro de 2019. Socorrida com vida, ficou internada por três dias, mas não
  resistiu aos ferimentos e morreu. Após o caso ser arquivado em 2020, a família
  contratou uma perícia particular, que ajudou a reabrir as investigações. Em 4
  de março de 2026, o policial militar Luis de Farias Pacheco foi condenado a 16
  anos e 4 meses de prisão em regime fechado
