name: Caso Hillary Souza Valadares
id: caso-hillary
published: true
ordem: 1
descricao: >-
  Hillary Souza Valadares tinha dois anos quando foi atingida na cabeça
  durante uma perseguição policial em Peruíbe, em 12 de fevereiro de 2019,
  e morreu. O caso chegou a ser arquivado, mas foi reaberto após investigações
  particulares da família. Em 4 de março de 2026, o policial militar Luis de
  Farias Pacheco foi condenado a 16 anos e 4 meses de prisão em regime fechado.
