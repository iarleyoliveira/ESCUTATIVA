  - formato: Vídeo
    title: Justiça decide que suspeito de matar a menina Hilary vai a júri popular;
      entenda (2024)
    veiculo: Globoplay / Jornal da Tribuna 1ª Edição
    resumo: Após a retomada das investigações e o avanço do processo, a Justiça
      decidiu levar a júri popular o policial suspeito de efetuar o disparo que
