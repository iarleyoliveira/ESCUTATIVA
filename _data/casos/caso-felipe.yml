name: Caso Felipe Ribeiro
ordem: 3
id: caso-felipe
descricao: Felipe Rodrigues, de quatro anos, foi diagnosticado com
  leucodistrofia hipomielinizante tipo 15, uma doença rara e sem cura que
  compromete seus movimentos. Sua família organizou uma vaquinha para comprar
  uma cadeira postural. Após a publicação da reportagem, um doador anônimo pagou
  pela cadeira, proporcionando mais conforto à rotina de Felipe e permitindo
  passeios com a família.
