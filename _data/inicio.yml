  title: "O jornalismo como ferramenta social e voz da população."
  presentation: "Escutativa é um trabalho de conclusão de curso que investiga a contribuição do jornalismo para a defesa dos direitos da população, a partir de histórias de pessoas que encontraram apoio na imprensa.\n\nNas entrevistas realizadas pelo grupo, os personagens destacaram a importância da visibilidade e da credibilidade jornalística para que suas demandas fossem ouvidas e suas histórias ganhassem novos capítulos.\n\nO projeto reúne minidocumentário, videocast e reportagens."
