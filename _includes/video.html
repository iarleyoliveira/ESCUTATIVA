{% assign player_video_value = include.video_id | default: include.publication.youtube_id %}
{% capture player_video_id %}{% include youtube-id.html value=player_video_value %}{% endcapture %}
{% assign player_video_id = player_video_id | strip %}
{% if player_video_id != '' %}
<iframe
  src="https://www.youtube-nocookie.com/embed/{{ player_video_id | uri_escape | escape }}"
  title="{{ include.publication.title | escape }}"
  loading="lazy"
  allowfullscreen
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
</iframe>
{% endif %}
